<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>plantist — sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <header class="nav">
    <a class="brand" href="index.html">plantist</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a class="sign-in active" href="login.html">Sign in</a>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="account.html">Account</a>
    </nav>
  </header>

  <main class="login-main">
    <section class="login-card">
      <p class="eyebrow">plantist</p>
      <h1 id="form-title">join us</h1>
      <p class="form-note" id="form-note">Create an account, or sign in below.</p>

      <form id="account-form">
        <div class="field profile-field">
          <label for="profile">Profile picture</label>
          <input id="profile" name="profile" type="file" accept="image/*">
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field name-field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="submit-button" type="submit" id="submit-button">Create account</button>
      </form>

      <button class="switch-button" type="button" id="switch-mode">
        Already have an account? Sign in
      </button>

      <p class="message" id="message" aria-live="polite"></p>

      <a class="back-home" id="back-home" href="home.html">back to home</a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
